<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./index.css">
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>ToDo List</title>
</head>
<body>

    <main class="container d-flex justify-content-center align-items-center h-100">
        <div class="row d-flex justify-content-center align-items-center">
            <section class="column d-flex justify-content-center align-items-center bg-secondary-subtle border border-secondary rounded-top p-2 gap-2">
                <div class="d-flex justify-content-center align-items-center col w-100">
                    <div class="form-floating p-1 w-100">
                        <input type="text" class="form-control" id="floatingInputGroup1" placeholder="New task...">
                        <label for="floatingInputGroup1">New task...</label>
                    </div>
                    <button id="floatingAddButton" class="btn btn-primary">ADD</button>
                </div>
            </section>
            <section class="d-flex p-2 bg-secondary-subtle border border-secondary rounded-bottom p-2 gap-2">
                <ul id="taskList" class="list-group w-100">
                </ul>
            </section>
        </div>
    </main>

    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
